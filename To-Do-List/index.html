<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>To-Do-List</title>
          <!-- Bootstrap 5 CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- As a link -->
<nav class="navbar bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">My To-Do List</a>
  </div>
</nav>
<div class="container">
 <h3>Task Manager</h3>
 <p>Organize your tasks and stay productive.</p>
 <div class="input-group">
  <input type="text" class="form-control" id="taskInput" placeholder="Enter a new task..." aria-label="Task Input" aria-describedby="button-addon">
   <button type="button" onclick="addTask()" class="btn btn-primary" id="addTaskBtn">Add Task</button>
</div>
 <!-- Alert for Error Validation -->
          <div id="errorAlert" class="alert alert-danger py-2 d-none" role="alert">
            Please enter a valid task name!
          </div>
<div class="tasks-section">

    <div class="tasks-header">
        <span>Your tasks</span>
        <span class="remaining-badge" id="taskCounter">0 remaining</span>
    </div>

    <div class="task-filters" role="group" aria-label="Task Filters">
        <button type="button" class="filter-btn active" id="filterAll">All</button>
        <button type="button" class="filter-btn" id="filterActive">Active</button>
        <button type="button" class="filter-btn" id="filterCompleted">Completed</button>
    </div>

    <!-- Task List Container -->
          <ul class="list-group mb-3" id="taskList">
            <!-- Dynamic Task Items Will Appear Here -->
          </ul>

    <!-- Empty State Message -->
          <div class="empty-message" id="emptyState">
          No tasks yet. Add your first task!
    </div>

    <div class="clear-container">
        <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
    </div>
</div>


  <!-- JavaScript CDN & Custom Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
    </body>
</html>
